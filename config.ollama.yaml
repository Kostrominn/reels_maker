# Локальный профиль LLM через Ollama (без внешнего API-ключа).
# Перед запуском: ollama serve
# Проверка модели: ollama list

transcription:
  backend: "faster-whisper"
  model: "medium"
  language: "ru"
  device: "cpu"
  compute_type: "int8"

llm:
  provider: "ollama"
  base_url: "http://127.0.0.1:11434/v1"
  # Для 5-6 GB VRAM лучше стартовать с 2-4B моделью; при возможности замените на 7B+.
  model: "gemma2:2b"
  temperature: 0.2
  max_tokens: 1200
  min_duration: 15
  max_duration: 90
  target_duration: 45
  max_chars: 8000
  chunk_overlap_segments: 1
  max_candidates: 6

video:
  output_quality: "high"
  output_format: "mp4"
  output_codec: "libx264"
  normalize_audio: true

storage:
  base_path: "./storage"
