# Профиль для бесплатного Qwen через OpenRouter
# с крупными чанками, чтобы не упираться в RPM-лимит.

transcription:
  backend: "faster-whisper"
  model: "medium"
  language: "ru"
  device: "cpu"
  compute_type: "int8"

llm:
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"
  model: "qwen/qwen3-next-80b-a3b-instruct:free"
  temperature: 0.2
  max_tokens: 1800
  min_duration: 15
  max_duration: 90
  target_duration: 45
  max_chars: 50000
  chunk_overlap_segments: 0
  max_candidates: 6

video:
  output_quality: "high"
  output_format: "mp4"
  output_codec: "libx264"
  normalize_audio: true

storage:
  base_path: "./storage"
