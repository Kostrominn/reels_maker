# Быстрый конфиг для смоук-тестов/разработки.
# Не влияет на основной `config.yaml`.
transcription:
  model: "medium"
  language: "ru"
  device: "cpu"
  compute_type: "int8"

llm:
  provider: "openrouter"
  model: "qwen/qwen-2.5-72b-instruct"
  # base_url: "https://openrouter.ai/api/v1"
  temperature: 0.7
  max_tokens: 2000
  min_duration: 15
  max_duration: 90
  target_duration: 45
  max_chars: 12000
  chunk_overlap_segments: 1
  max_candidates: 6

video:
  output_quality: "high"
  output_format: "mp4"
  output_codec: "libx264"
  normalize_audio: true

storage:
  base_path: "./storage"
